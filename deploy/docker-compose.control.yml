name: dockpulse-control
services:
  dockpulse-control:
    image: ghcr.io/agugliotta/dockpulse-control:${DOCKPULSE_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      DOCKPULSE_ENCRYPTION_KEY: ${DOCKPULSE_ENCRYPTION_KEY:?set in the control env file}
      DOCKPULSE_BOOTSTRAP_TOKEN: ${DOCKPULSE_BOOTSTRAP_TOKEN:?set in the control env file}
    ports:
      - "${DOCKPULSE_CONTROL_PORT:-8080}:8080"
    volumes:
      - dockpulse-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    labels:
      io.dockpulse.manage: "false"

volumes:
  dockpulse-data:
