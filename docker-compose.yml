# Development/evaluation only: Server and Agent in one Docker network.
# Proxmox deployments should use the role-specific files under deploy/.
name: dockpulse
services:
  dockpulse-control:
    build:
      context: .
      dockerfile: Dockerfile.control
    image: dockpulse/control:${DOCKPULSE_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOCKPULSE_ENCRYPTION_KEY: ${DOCKPULSE_ENCRYPTION_KEY:?set in .env}
      DOCKPULSE_BOOTSTRAP_TOKEN: ${DOCKPULSE_BOOTSTRAP_TOKEN:?set in .env}
      DOCKPULSE_VERSION: ${DOCKPULSE_VERSION:-latest}
      DOCKPULSE_UPDATE_VERSION: ${DOCKPULSE_UPDATE_VERSION:-latest}
    ports:
      - "${DOCKPULSE_CONTROL_PORT:-8080}:8080"
    volumes:
      - dockpulse-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    labels:
      io.dockpulse.manage: "false"

  dockpulse-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: dockpulse/agent:${DOCKPULSE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      dockpulse-control:
        condition: service_healthy
    environment:
      DOCKPULSE_AGENT_ID: ${DOCKPULSE_AGENT_ID:-lxc-101}
      DOCKPULSE_AGENT_NAME: ${DOCKPULSE_AGENT_NAME:-docker-lxc-101}
      DOCKPULSE_AGENT_URL: http://dockpulse-agent:9090
      DOCKPULSE_AGENT_SECRET: ${DOCKPULSE_AGENT_SECRET:?set in .env}
      DOCKPULSE_CONTROL_URL: http://dockpulse-control:8080
      DOCKPULSE_BOOTSTRAP_TOKEN: ${DOCKPULSE_BOOTSTRAP_TOKEN:?set in .env}
      DOCKPULSE_READ_ONLY: ${DOCKPULSE_READ_ONLY:-true}
      DOCKPULSE_COMPOSE_ROOTS: ${DOCKPULSE_COMPOSE_ROOTS:-/opt/stacks,/srv/compose}
      DOCKPULSE_VERSION: ${DOCKPULSE_VERSION:-latest}
      DOCKPULSE_UPDATE_VERSION: ${DOCKPULSE_UPDATE_VERSION:-latest}
      DOCKPULSE_SELF_UPDATE_ENABLED: ${DOCKPULSE_SELF_UPDATE_ENABLED:-false}
      DOCKPULSE_SELF_UPDATE_DIR: ${DOCKPULSE_SELF_UPDATE_DIR:-/workspace}
      DOCKPULSE_SELF_UPDATE_PROJECT: ${DOCKPULSE_SELF_UPDATE_PROJECT:-dockpulse}
      DOCKPULSE_SELF_UPDATE_SERVICE: ${DOCKPULSE_SELF_UPDATE_SERVICE:-dockpulse-agent}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
      - ${DOCKPULSE_STACKS_PATH:-./examples/stacks}:/opt/stacks:ro
      - ${DOCKPULSE_COMPOSE_PATH:-./examples/compose}:/srv/compose:ro
    security_opt:
      - no-new-privileges:true
    labels:
      io.dockpulse.manage: "false"

volumes:
  dockpulse-data:
